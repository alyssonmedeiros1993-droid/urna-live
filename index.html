<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Transmissão</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #0066ff;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.card {
    background: #222;
    width: 250px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.card img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
}

button {
    background: #00cc66;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #009944;
}

#status {
    margin: 20px;
    padding: 15px;
    background: #333;
}
</style>

</head>

<body>

<header>
AO VIVO - CONTROLE DE TRANSMISSÃO
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/150">
<h2>Candidato 1</h2>
<p>Número: 10</p>
<button onclick="votar('Candidato 1')">
Selecionar
</button>
</div>


<div class="card">
<img src="https://via.placeholder.com/150">
<h2>Candidato 2</h2>
<p>Número: 20</p>
<button onclick="votar('Candidato 2')">
Selecionar
</button>
</div>


<div class="card">
<img src="https://via.placeholder.com/150">
<h2>Candidato 3</h2>
<p>Número: 30</p>
<button onclick="votar('Candidato 3')">
Selecionar
</button>
</div>

</div>

<div id="status">
Nenhum candidato selecionado.
</div>


<script>

function votar(nome){
document.getElementById("status").innerHTML =
"Selecionado: " + nome;
}

</script>

</body>
</html>
