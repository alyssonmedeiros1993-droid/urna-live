<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Urna Live</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


<header class="topo">

    <h1>🔐 Acesso Administrativo</h1>

    <p>Entre para controlar a votação</p>

</header>



<main class="conteudo">


<section class="card">


    <h2>Login</h2>


    <input 
        type="text" 
        id="usuario"
        placeholder="Usuário">


    <br><br>


    <input 
        type="password" 
        id="senha"
        placeholder="Senha">


    <br><br>


    <button onclick="entrar()">
        Entrar
    </button>


    <p id="mensagem"></p>


</section>


</main>



<script src="../js/login.js"></script>


</body>

</html>
